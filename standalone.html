<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rato_Milo Feedback Hub - Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .checkmark__circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: #7ac142; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark { width: 56px; height: 56px; border-radius: 50%; display: block; stroke-width: 2; stroke: #fff; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px #7ac142; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 30px #7ac142; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); } 20%, 40%, 60%, 80% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="app" class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-slate-900 text-white p-6 md:fixed md:h-full flex flex-col gap-8 z-20 transition-all">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-500 rounded flex items-center justify-center font-bold text-lg">RM</div>
                <h1 class="text-xl font-bold tracking-tight">Rato_Milo</h1>
            </div>
            <nav class="flex-1 flex flex-col gap-2">
                <button id="btnReview" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium bg-indigo-600 text-white shadow-md transition-all">
                    <span>📝 Feedback Terminal</span>
                </button>
                <button id="btnAdmin" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                    <span>🔒 Admin Console</span>
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center gap-3 bg-slate-800 p-3 rounded-lg">
                    <div id="userInitials" class="w-8 h-8 rounded-full bg-indigo-200 text-indigo-800 flex items-center justify-center font-bold text-xs uppercase">GU</div>
                    <div class="flex-1 min-w-0">
                        <p id="authStatusLabel" class="text-xs font-semibold truncate">Guest Access</p>
                        <p id="userEmailLabel" class="text-[10px] text-slate-400 truncate tracking-tight">Login Required</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 md:ml-64 flex flex-col">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-slate-400 font-medium" id="headerCategory">Terminal</span>
                    <span class="text-slate-300">/</span>
                    <span class="text-slate-900 font-semibold" id="headerTitle">Feedback Terminal</span>
                </div>
            </header>

            <!-- Pages -->
            <div id="pageContainer" class="flex-1 p-6 md:p-10">
                <!-- Review Page -->
                <div id="pageReview" class="max-w-xl mx-auto block h-full">
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">Feedback Hub</h3>
                                <p class="text-xs text-slate-500 font-medium uppercase font-mono tracking-tighter">Terminal Node v2.0</p>
                            </div>
                            <span class="px-2 py-1 bg-indigo-50 text-indigo-700 text-[10px] font-bold rounded">STATION 01</span>
                        </div>
                        <div class="p-6 md:p-8 space-y-6">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Classification</label>
                                <div class="flex gap-4">
                                    <button onclick="setClassification('Good')" id="classGood" class="flex-1 py-2 px-2 border-2 border-slate-100 text-slate-400 rounded font-bold text-xs transition-all">GOOD</button>
                                    <button onclick="setClassification('Bad')" id="classBad" class="flex-1 py-2 px-2 border-2 border-slate-100 text-slate-400 rounded font-bold text-xs transition-all">BAD</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Name</label>
                                    <input type="text" id="visitorName" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-indigo-500" placeholder="Someone">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Date</label>
                                    <input type="date" id="visitDate" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded text-sm outline-none focus:ring-1 focus:ring-indigo-500">
                                </div>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Rating</label>
                                <div class="flex flex-row-reverse justify-end gap-1 text-2xl">
                                    <span class="star hover:text-amber-400 cursor-pointer text-slate-200" data-val="5">★</span>
                                    <span class="star hover:text-amber-400 cursor-pointer text-slate-200" data-val="4">★</span>
                                    <span class="star hover:text-amber-400 cursor-pointer text-slate-200" data-val="3">★</span>
                                    <span class="star hover:text-amber-400 cursor-pointer text-slate-200" data-val="2">★</span>
                                    <span class="star hover:text-amber-400 cursor-pointer text-slate-200" data-val="1">★</span>
                                </div>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Details</label>
                                <textarea id="details" class="w-full h-32 px-3 py-2 bg-slate-50 border border-slate-200 rounded text-sm resize-none outline-none focus:ring-1 focus:ring-indigo-500 shadow-inner" placeholder="Describe your experience here..."></textarea>
                            </div>
                            <button onclick="submitReview()" id="submitBtn" class="w-full bg-slate-900 text-white py-3 rounded font-bold text-sm shadow-md hover:bg-slate-800 transition-all uppercase tracking-widest">Submit Feedback</button>
                            
                            <!-- Success State -->
                            <div id="successState" class="hidden text-center py-4 bg-green-50 rounded border border-green-100">
                                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/><path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/></svg>
                                <p class="text-green-700 font-black text-[10px] uppercase tracking-widest mt-2">Sended!</p>
                                <p class="text-green-600 text-xs mt-1">Data synchronized with Admin Node</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Admin Auth Page -->
                <div id="pageAdminAuth" class="hidden">
                    <div class="max-w-md mx-auto pt-10 text-center bg-white p-8 rounded-xl border border-slate-200 shadow-xl">
                        <div class="w-16 h-16 bg-slate-900 rounded-lg flex items-center justify-center mx-auto mb-6 text-indigo-400">🔒</div>
                        <h2 class="text-xl font-bold text-slate-900 uppercase">Admin Gateway</h2>
                        <p class="text-slate-500 text-[10px] mt-2 mb-6 font-bold uppercase tracking-widest">Restricted Access Node</p>
                        
                        <div class="space-y-4">
                            <input type="password" id="passkeyInput" class="w-full bg-slate-50 border border-slate-200 rounded py-3 text-center font-bold tracking-[0.3em] text-lg outline-none focus:ring-1 focus:ring-indigo-500" placeholder="Passkey">
                            <button id="btnAuthenticate" onclick="window.verifyAdmin()" class="w-full bg-indigo-600 text-white py-3 rounded font-bold text-xs uppercase tracking-widest shadow-md hover:bg-indigo-700 transition-all">Authenticate</button>
                            
                            <div class="flex items-center gap-4 my-6">
                                <div class="flex-1 h-px bg-slate-100"></div>
                                <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">or system login</span>
                                <div class="flex-1 h-px bg-slate-100"></div>
                            </div>

                            <button onclick="window.handleGoogleLogin()" class="w-full bg-white border border-slate-200 text-slate-900 py-3 rounded font-bold text-[10px] hover:bg-slate-50 transition-all flex items-center justify-center gap-3 active:scale-[0.98] shadow-sm uppercase tracking-wider">
                                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                Google Admin Provider
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Admin Dashboard -->
                <div id="pageAdminDashboard" class="hidden max-w-4xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded bg-indigo-600 text-white flex items-center justify-center font-bold text-xs uppercase">AD</div>
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">Admin Controller</h2>
                                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Node Activity Monitor</p>
                            </div>
                        </div>
                        <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-red-50 text-red-600 rounded text-[10px] font-bold border border-red-100 uppercase">Exit Console</button>
                    </div>
                    <div id="inboxContainer" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-4">
                        <!-- Items will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js';

        const firebaseConfig = {
            projectId: "gen-lang-client-0641038539",
            appId: "1:677459259599:web:b98589264e65ffb204c7ba",
            apiKey: "AIzaSyBTM_Ebjv2B90iGbn6txRY67fEcHDts15o",
            authDomain: "gen-lang-client-0641038539.firebaseapp.com",
            storageBucket: "gen-lang-client-0641038539.firebasestorage.app",
            messagingSenderId: "677459259599"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app, "ai-studio-4fdd7465-9613-4e02-a721-f62088a665bd");
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // State
        let currentClassification = null;
        let currentRating = 0;
        let user = null;

        // Auth Listener
        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) {
                document.getElementById('authStatusLabel').innerText = 'Authenticated';
                document.getElementById('userEmailLabel').innerText = u.email;
                document.getElementById('userInitials').innerText = u.email.substring(0, 2).toUpperCase();
                
                // If we are on the auth page and they just logged in as admin, move them to dashboard
                if (u.email === 'jdfhahfe@gmail.com') {
                    const isAuthPageVisible = !document.getElementById('pageAdminAuth').classList.contains('hidden');
                    if (isAuthPageVisible) {
                        showPage('admin');
                    }
                }

                // If we are on the admin page, refresh
                if (!document.getElementById('pageAdminDashboard').classList.contains('hidden')) {
                    loadInbox();
                }
            } else {
                document.getElementById('authStatusLabel').innerText = 'Guest Access';
                document.getElementById('userEmailLabel').innerText = 'Login Required';
                document.getElementById('userInitials').innerText = 'GU';
            }
        });

        window.handleGoogleLogin = async () => {
            const btn = event?.currentTarget;
            const originalText = btn ? btn.innerText : '';
            if (btn) btn.innerText = 'Initializing...';
            
            try {
                const result = await signInWithPopup(auth, provider);
                if (result.user) {
                    if (result.user.email === 'jdfhahfe@gmail.com') {
                        showPage('admin');
                    } else {
                        alert('Access Denied: ' + result.user.email + ' is not an authorized administrator.');
                    }
                }
            } catch (e) {
                console.error(e);
                // If popup is blocked or fails in iframe, we can try alerting specifically
                if (e.code === 'auth/popup-closed-by-user') {
                    // Do nothing
                } else if (e.code === 'auth/cancelled-popup-request') {
                    // Do nothing
                } else {
                    alert('Login Error: ' + e.message + '\n\nTip: If you are in a school environment, you might need to enable popups or third-party cookies for this domain.');
                }
            } finally {
                if (btn) btn.innerText = originalText;
            }
        };

        // UI Helpers
        const showPage = (pageName) => {
            const pages = ['pageReview', 'pageAdminAuth', 'pageAdminDashboard'];
            pages.forEach(p => document.getElementById(p).classList.add('hidden'));
            
            if (pageName === 'admin') {
                if (user && user.email === 'jdfhahfe@gmail.com') {
                    document.getElementById('pageAdminDashboard').classList.remove('hidden');
                    document.getElementById('headerCategory').innerText = 'Console';
                    document.getElementById('headerTitle').innerText = 'Admin Management Node';
                    loadInbox();
                } else {
                    document.getElementById('pageAdminAuth').classList.remove('hidden');
                }
                document.getElementById('btnAdmin').classList.add('bg-indigo-600', 'text-white');
                document.getElementById('btnAdmin').classList.remove('text-slate-400');
                document.getElementById('btnReview').classList.remove('bg-indigo-600', 'text-white');
                document.getElementById('btnReview').classList.add('text-slate-400');
            } else {
                document.getElementById('pageReview').classList.remove('hidden');
                document.getElementById('headerCategory').innerText = 'Terminal';
                document.getElementById('headerTitle').innerText = 'Feedback Terminal';
                document.getElementById('btnReview').classList.add('bg-indigo-600', 'text-white');
                document.getElementById('btnReview').classList.remove('text-slate-400');
                document.getElementById('btnAdmin').classList.remove('bg-indigo-600', 'text-white');
                document.getElementById('btnAdmin').classList.add('text-slate-400');
            }
        };

        window.setClassification = (type) => {
            currentClassification = type;
            const gc = document.getElementById('classGood');
            const bc = document.getElementById('classBad');
            if (type === 'Good') {
                gc.className = 'flex-1 py-1 px-2 border-2 border-green-500 bg-green-500 text-white rounded font-bold text-xs transition-all';
                bc.className = 'flex-1 py-1 px-2 border-2 border-slate-100 text-slate-400 rounded font-bold text-xs transition-all';
            } else {
                bc.className = 'flex-1 py-1 px-2 border-2 border-red-500 bg-red-500 text-white rounded font-bold text-xs transition-all';
                gc.className = 'flex-1 py-1 px-2 border-2 border-slate-100 text-slate-400 rounded font-bold text-xs transition-all';
            }
        };

        window.submitReview = async () => {
            const name = document.getElementById('visitorName').value;
            const date = document.getElementById('visitDate').value;
            const details = document.getElementById('details').value;

            if (!name || !date || !details || !currentClassification || !currentRating) {
                alert('Please complete all fields.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Synchronizing...';
            btn.disabled = true;

            try {
                await addDoc(collection(db, 'reviews'), {
                    visitorName: name,
                    visitDate: date,
                    details: details,
                    classification: currentClassification,
                    rating: currentRating,
                    status: 'pending',
                    timestamp: serverTimestamp(),
                    type: 'General Feedback'
                });

                document.getElementById('successState').classList.remove('hidden');
                btn.classList.add('hidden');
                
                setTimeout(() => {
                    document.getElementById('successState').classList.add('hidden');
                    btn.classList.remove('hidden');
                    btn.innerText = 'Submit Feedback';
                    btn.disabled = false;
                    // Reset form
                    document.getElementById('visitorName').value = '';
                    document.getElementById('details').value = '';
                    currentClassification = null;
                    currentRating = 0;
                    document.querySelectorAll('.star').forEach(s => s.className = 'star cursor-pointer text-slate-200');
                    document.getElementById('classGood').className = 'flex-1 py-1 px-2 border-2 border-slate-100 text-slate-400 rounded font-bold text-xs transition-all';
                    document.getElementById('classBad').className = 'flex-1 py-1 px-2 border-2 border-slate-100 text-slate-400 rounded font-bold text-xs transition-all';
                }, 4000);
            } catch (e) {
                console.error(e);
                alert('Submit failed: ' + e.message);
                btn.innerText = 'Submit Feedback';
                btn.disabled = false;
            }
        };

        window.verifyAdmin = async () => {
            const input = document.getElementById('passkeyInput');
            const val = input.value;
            
            if (val === 'rat123') {
                if (user) {
                    if (user.email === 'jdfhahfe@gmail.com') {
                        showPage('admin');
                    } else {
                        alert('Identity Mismatch: You are logged in as ' + user.email + '. This node requires authorized access from jdfhahfe@gmail.com.');
                        if(confirm('Logout and switch accounts?')) {
                            await signOut(auth);
                            window.handleGoogleLogin();
                        }
                    }
                } else {
                    alert('Passkey accepted. Initializing Google Security Layer...');
                    window.handleGoogleLogin();
                }
            } else {
                input.classList.add('border-red-500', 'animate-shake');
                alert('Invalid Passkey');
                input.value = '';
                setTimeout(() => input.classList.remove('border-red-500', 'animate-shake'), 1000);
            }
        };

        window.logoutAdmin = async () => {
            await signOut(auth);
            showPage('review');
        };

        // Navigation
        document.getElementById('btnReview').onclick = () => showPage('review');
        document.getElementById('btnAdmin').onclick = () => showPage('admin');

        // Rating Stars
        document.querySelectorAll('.star').forEach(s => {
            s.onclick = () => {
                const val = parseInt(s.dataset.val);
                currentRating = val;
                document.querySelectorAll('.star').forEach(star => {
                    const sv = parseInt(star.dataset.val);
                    star.className = sv <= val ? 'star cursor-pointer text-amber-400' : 'star cursor-pointer text-slate-200';
                });
            };
        });

        // Admin Log Logic
        let unsubscribe;
        const loadInbox = () => {
            if (unsubscribe) unsubscribe();
            const q = query(collection(db, 'reviews'), orderBy('timestamp', 'desc'));
            unsubscribe = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('inboxContainer');
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = '<p class=\"text-center text-slate-400 text-xs py-10 italic\">No interactions recorded yet.</p>';
                }
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const item = document.createElement('div');
                    item.className = 'p-4 rounded-lg bg-slate-50 border border-slate-200 relative group';
                    
                    const ratingStr = '★'.repeat(data.rating) + '☆'.repeat(5-data.rating);
                    const classColor = data.classification === 'Good' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                    
                    // Safe timestamp string
                    const timeStr = data.timestamp ? data.timestamp.toDate().toLocaleTimeString() : 'Syncing...';

                    item.innerHTML = `
                        <div class=\"flex justify-between items-start\">
                            <div>
                                <span class=\"inline-block px-2 py-0.5 ${classColor} text-[8px] font-black rounded uppercase tracking-widest\">${data.classification}</span>
                                <h4 class=\"text-sm font-bold mt-1 text-slate-900\">${data.visitorName} <span class=\"text-slate-400 font-normal ml-2 text-[10px]\">${timeStr}</span></h4>
                            </div>
                            <div class=\"text-amber-400 text-xs tracking-tighter\">${ratingStr}</div>
                        </div>
                        <p class=\"text-xs text-slate-600 mt-2 bg-white p-2 border border-slate-100\">${data.details}</p>
                        ${data.adminReply ? `
                            <div class=\"mt-3 bg-indigo-50 p-3 rounded text-[11px] border-l-4 border-indigo-500 font-medium\">
                                <p class=\"font-black text-indigo-900 text-[9px] uppercase tracking-widest mb-1\">Admin Response:</p>
                                <p class=\"text-indigo-700\">${data.adminReply}</p>
                            </div>
                        ` : `
                            <div class=\"mt-3 pt-3 border-t border-slate-200 flex items-center gap-2\">
                                <div class=\"w-5 h-5 rounded bg-indigo-600 text-white flex items-center justify-center text-[8px] font-black\">A</div>
                                <input type=\"text\" id=\"reply-${id}\" class=\"flex-1 bg-white border border-slate-200 rounded px-2 py-1 text-[11px] outline-none focus:ring-1 focus:ring-indigo-400 font-medium\" placeholder=\"Type a professional reply...\">
                                <button onclick=\"window.replyToReview('${id}')\" class=\"text-[10px] font-black text-indigo-600 hover:underline tracking-tight uppercase\">Reply</button>
                            </div>
                        `}
                        <button onclick=\"window.deleteReview('${id}')\" class=\"absolute right-2 top-10 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 text-xs\">🗑️</button>
                    `;
                    container.appendChild(item);
                }, (error) => {
                    console.error("Snapshot error:", error);
                    container.innerHTML = `<div class=\"p-6 text-center\"><p class=\"text-red-500 font-bold text-xs\">ACCESS DENIED</p><p class=\"text-[10px] text-slate-400 mt-2\">Please ensure you are signed in with the authorized Admin Google account.</p></div>`;
                });
            });
        };

        window.replyToReview = async (id) => {
            const replyInput = document.getElementById(`reply-${id}`);
            const reply = replyInput.value;
            if (!reply) return;
            try {
                await updateDoc(doc(db, 'reviews', id), {
                    adminReply: reply,
                    status: 'replied',
                    repliedAt: serverTimestamp()
                });
            } catch (e) { 
                console.error(e);
                alert('Reply failed: Access Denied. Only authorized admins can reply.'); 
            }
        };

        window.deleteReview = async (id) => {
            if (confirm('Delete record?')) {
                try {
                    await deleteDoc(doc(db, 'reviews', id));
                } catch (e) {
                    alert('Delete failed: Access Denied.');
                }
            }
        };

        // Bootstrap
        document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
